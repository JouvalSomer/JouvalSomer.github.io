# --- Site settings ---
title: Jouval Somer
tagline: Machine learning for hydrology
description: >-
  Jouval Somer, Industry PhD candidate in machine learning for hydrology at the
  University of Oslo and Expert Analytics. Notes, CV, publications and projects.
author:
  name: Jouval Max Erik Somer
  email: jouval.somer@gmail.com

# Update this after you create the repo. For a user site
# (JouvalSomer.github.io) leave baseurl empty and set url below.
url: "https://JouvalSomer.github.io"
baseurl: ""

# --- Social / contact links ---
github_username: JouvalSomer
linkedin_username: jouvalsomer
email: jouval.somer@gmail.com

# --- Search engines ---
# Google Search Console ownership check; jekyll-seo-tag writes the meta tag.
webmaster_verifications:
  google: "_Nun8iRRSD2tM7-exMqJlI4SBcUwTWW0GLsJcP1LgFI"

# --- Collaborative annotation (Hypothesis) ---
# Adds a margin-comment + highlight layer to blog posts for supervisor feedback.
# Per-post override with `annotations: false` in the post front matter.
#
# OFF while the site is public and no private group is configured. With an empty
# annotations_group the layer defaults to the PUBLIC Hypothesis group, which
# would let any Hypothesis account leave notes that every visitor can see.
# To turn it back on: create a private group at https://hypothes.is/groups/new,
# paste its ID below, then set annotations: true.
annotations: false
annotations_group: ""

# --- Build settings ---
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
timezone: Europe/Oslo

# Collections
collections:
  news:
    output: false
  projects:
    output: false

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

# Pagination for blog (jekyll-paginate)
paginate: 5
paginate_path: "/blog/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - resume.cls
  - "*.tex"
  - assets/cv/README.md
  - assets/img/README.md
