<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-links">
      <a href="https://github.com/{{ site.github_username }}" rel="me noopener" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" rel="me noopener" target="_blank">LinkedIn</a>
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <button id="theme-toggle" class="theme-toggle" type="button">
        <span class="theme-label-dark">Dark</span><span class="theme-label-light">Light</span>
      </button>
    </div>
    <p class="footer-copy">© {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</footer>
